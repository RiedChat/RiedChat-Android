plugins {
    id 'com.android.application'
}

android {
    namespace 'riedchat.quardinimus.edition'
    compileSdk 34

    defaultConfig {
        applicationId "riedchat.quardinimus.edition"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Needed for ActivityCompat/ContextCompat runtime permission helpers used for downloads
    implementation 'androidx.core:core:1.12.0'
    // MainActivity теперь extends FragmentActivity — это единственное требование
    // androidx.biometric.BiometricPrompt (используется внутри FragmentManager
    // для доставки результата, независимого от жизненного цикла), полноценный
    // AppCompat/Material тут не нужен.
    implementation 'androidx.fragment:fragment:1.8.4'
    implementation 'androidx.biometric:biometric:1.1.0'
}

// БАГ: androidx.fragment/androidx.biometric транзитивно тянут kotlin-stdlib
// 1.8.22, а какая-то другая зависимость в графе (или AGP-плагин) — старый
// kotlin-stdlib-jdk7/kotlin-stdlib-jdk8 1.6.21. Начиная с Kotlin 1.8 классы
// из *-jdk7/*-jdk8 слиты в сам kotlin-stdlib, поэтому при одновременном
// присутствии старой и новой версии классы дублируются и AGP падает на
// checkReleaseDuplicateClasses. Эти два модуля больше не нужны ни при каком
// раскладе (их содержимое уже в kotlin-stdlib) — исключаем глобально.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
