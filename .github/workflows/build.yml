name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Собрать Release APK
        run: gradle assembleRelease

      - name: Подписать APK вручную
        run: |
          # Декодируем keystore из секрета
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d -i > keystore.jks || \
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode --ignore-garbage > keystore.jks

          # Путь к build-tools (берём последнюю доступную версию)
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          echo "Используем build-tools: $BUILD_TOOLS"

          # Подписываем
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks keystore.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out RiedChat.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: RiedChat.apk
          retention-days: 30
